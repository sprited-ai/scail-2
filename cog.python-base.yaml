# Replicate packaging for SCAIL-2 (zai-org) — end-to-end character animation.
#
# Runs the official ComfyUI implementation headless (WanSCAILToVideo,
# ComfyUI v0.33.1 pinned by commit) on the Comfy-Org fp8 repack of the 14B
# model. All weights are bundled at build time; setup only verifies and loads them.
# See README.md / NOTICE.
build:
  gpu: true
  cuda: "12.8"
  python_version: "3.12"
  system_packages:
    - "ffmpeg"
    - "git"
    - "libgl1"
    - "libglib2.0-0"
  python_requirements: requirements.txt
  run:
    - curl -fsSL https://github.com/replicate/pget/releases/latest/download/pget_linux_x86_64 -o /usr/local/bin/pget && chmod +x /usr/local/bin/pget
    # ComfyUI v0.33.1 (72865f4f) — the version the WanSCAILToVideo graph was validated on
    - git clone https://github.com/comfyanonymous/ComfyUI.git /ComfyUI && cd /ComfyUI && git checkout 72865f4f27eaf5396f8f36370e0a2be3a9a090ee && rm -rf .git
    # cog's template installs `cog` into the Ubuntu python (3.12.3, /usr) but our
    # requirements into the uv-managed 3.12.12 that /usr/bin/python3 points at, and
    # its CMD runs bare `python`. Keep everything in the uv interpreter.
    - uv pip install --python /usr/local/bin/python --break-system-packages -r /ComfyUI/requirements.txt
    # Bundle model weights. Separate commands keep each download in its own cached layer.
    - mkdir -p /ComfyUI/models/diffusion_models /ComfyUI/models/text_encoders /ComfyUI/models/vae /ComfyUI/models/clip_vision /ComfyUI/models/loras
    - pget -f https://huggingface.co/Comfy-Org/SCAIL-2/resolve/main/diffusion_models/wan2.1_14B_SCAIL_2_fp8_scaled.safetensors /ComfyUI/models/diffusion_models/wan2.1_14B_SCAIL_2_fp8_scaled.safetensors && test "$(stat -c %s /ComfyUI/models/diffusion_models/wan2.1_14B_SCAIL_2_fp8_scaled.safetensors)" = "17694586857"
    - pget -f https://huggingface.co/Comfy-Org/Wan_2.1_ComfyUI_repackaged/resolve/main/split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors /ComfyUI/models/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors && test "$(stat -c %s /ComfyUI/models/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors)" = "6735906897"
    - pget -f https://huggingface.co/Comfy-Org/Wan_2.1_ComfyUI_repackaged/resolve/main/split_files/vae/wan_2.1_vae.safetensors /ComfyUI/models/vae/wan_2.1_vae.safetensors && test "$(stat -c %s /ComfyUI/models/vae/wan_2.1_vae.safetensors)" = "253815318"
    - pget -f https://huggingface.co/Comfy-Org/Wan_2.1_ComfyUI_repackaged/resolve/main/split_files/clip_vision/clip_vision_h.safetensors /ComfyUI/models/clip_vision/clip_vision_h.safetensors && test "$(stat -c %s /ComfyUI/models/clip_vision/clip_vision_h.safetensors)" = "1264219396"
    - pget -f https://huggingface.co/Comfy-Org/SCAIL-2/resolve/main/loras/wan2.1_SCAIL_2_DPO_lora_bf16.safetensors /ComfyUI/models/loras/wan2.1_SCAIL_2_DPO_lora_bf16.safetensors && test "$(stat -c %s /ComfyUI/models/loras/wan2.1_SCAIL_2_DPO_lora_bf16.safetensors)" = "1226936552"
    - pget -f https://huggingface.co/Comfy-Org/SCAIL-2/resolve/main/loras/wan2.1_SCAIL_2_relight_lora_bf16.safetensors /ComfyUI/models/loras/wan2.1_SCAIL_2_relight_lora_bf16.safetensors && test "$(stat -c %s /ComfyUI/models/loras/wan2.1_SCAIL_2_relight_lora_bf16.safetensors)" = "1226936552"
    - pget -f https://huggingface.co/Kijai/WanVideo_comfy/resolve/main/Lightx2v/lightx2v_I2V_14B_480p_cfg_step_distill_rank64_bf16.safetensors /ComfyUI/models/loras/lightx2v_I2V_14B_480p_cfg_step_distill_rank64_bf16.safetensors && test "$(stat -c %s /ComfyUI/models/loras/lightx2v_I2V_14B_480p_cfg_step_distill_rank64_bf16.safetensors)" = "738005744"
    - pget -f https://huggingface.co/Comfy-Org/SCAIL-2/resolve/fe3c728bc793ba21ca674688f822afb709ad44fb/diffusion_models/wan2.1_14B_SCAIL_2_fp16.safetensors /ComfyUI/models/diffusion_models/wan2.1_14B_SCAIL_2_fp16.safetensors && test "$(stat -c %s /ComfyUI/models/diffusion_models/wan2.1_14B_SCAIL_2_fp16.safetensors)" = "32794040328"
    - pget -f https://huggingface.co/Kijai/WanVideo_comfy/resolve/8260d429d19fd7a72304cad059160b95d843913f/Wan2_1_VAE_bf16.safetensors /ComfyUI/models/vae/Wan2_1_VAE_bf16.safetensors && test "$(stat -c %s /ComfyUI/models/vae/Wan2_1_VAE_bf16.safetensors)" = "253806278"
    # BiRefNet (MIT) for automatic single-subject masks — 0.9 GB into the HF cache
    - python3 -c "from huggingface_hub import snapshot_download; snapshot_download('ZhengPeng7/BiRefNet')"
    # cog runtime into the same interpreter, `python` alias for cog's CMD, and a loud check
    - uv pip install --python /usr/local/bin/python --break-system-packages cog==0.22.0 coglet==0.22.0
    - python -c "import cog, coglet, torch, av, websocket, transformers, timm, huggingface_hub; print('runtime ok', torch.__version__)"
    # Replicate installs runtime dependencies before setup(). This interpreter is
    # owned by this disposable image; uv's PEP 668 marker blocks that bootstrap.
    - python -c "import pathlib, sysconfig; (pathlib.Path(sysconfig.get_path('stdlib')) / 'EXTERNALLY-MANAGED').unlink(missing_ok=True)"
    - python -m pip install cog==0.23.0 coglet==0.23.0
run: "predict.py:Predictor"
